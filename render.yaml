services:
  - type: web
    name: monitoring-pkl-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_NAME
        value: "Monitoring PKL"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_LOCALE
        value: id
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: monitoring-pkl-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: monitoring-pkl-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: monitoring-pkl-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: monitoring-pkl-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: monitoring-pkl-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: monitoring-pkl-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: monitoring-pkl-db
    plan: free
    databaseName: monitoring_pkl
    user: monitoring_pkl_user
